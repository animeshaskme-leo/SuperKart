version: '3.8'

services:
  backend:
    build:
      context: ./backend_files
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./backend_files:/app
    command: gunicorn -w 4 -b 0.0.0.0:7860 app:app

  frontend:
    build:
      context: ./frontend_files
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./frontend_files:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend
